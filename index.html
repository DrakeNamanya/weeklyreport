<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYE KATALE DASHBOARD</title>
    <style>
        :root {
            --primary-blue: #71a3c1;
            --light-blue: #94c8f3;
            --heifer-green: #01AC66;
            --dark-navy: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 15px;
            background: linear-gradient(to right, var(--primary-blue) 0%, var(--light-blue) 100%);
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevents body scroll */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .logo { height: 40px; }

        .header-center {
            text-align: center;
        }

        .title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--dark-navy);
            margin: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .apk-download-btn {
            padding: 10px 20px; 
            background: var(--heifer-green); 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .apk-download-btn:hover { background: #018f55; }

        .info-pill {
            background: #f0f4f7;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--dark-navy);
            border: 1px solid #d1d9e0;
        }

        .dashboard-container {
            flex-grow: 1;
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            margin-bottom: 10px;
        }

        iframe {
            border: none;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; text-align: center; }
            .header-actions { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    <header class="header">
        <img src="https://via.placeholder.com/150x50/ffffff/71a3c1?text=Logo" alt="Logo" class="logo">
        
        <div class="header-center">
            <h1 class="title">CLUSTER PERFORMANCE DASHBOARD</h1>
        </div>

        <div class="header-actions">
            <div class="info-pill">
                🔐 <b>Access:</b> Sign in with Heifer ID
            </div>
            <a href="https://datcollectors.org/dl" target="_blank" id="downloadBtn" class="apk-download-btn">
                📱 Download App
            </a>
        </div>
    </header>

    <main class="dashboard-container">
        <iframe 
            title="cluster-performance" 
            width="100%" 
            height="100%" 
            src="https://app.powerbi.com/reportEmbed?reportId=5eded2fa-4f25-4070-8027-167078ac1e50&autoAuth=true&ctid=da6a69e3-3bcd-4f44-a340-aead0cfda08f" 
            frameborder="0" 
            allowFullScreen="true">
        </iframe>
    </main>

    <script>
        // Simple tracker for the header button
        const btn = document.getElementById('downloadBtn');
        btn.addEventListener('click', () => {
            let count = localStorage.getItem('saye_app_downloads') || 0;
            count++;
            localStorage.setItem('saye_app_downloads', count);
            console.log("Downloads:", count);
        });
    </script>
</body>
</html>
