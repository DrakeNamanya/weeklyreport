<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYE KATALE DASHBOARD</title>
    <style>
        :root {
            --primary-blue: #71a3c1;
            --light-blue: #94c8f3;
            --heifer-green: #01AC66;
            --dark-navy: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(to right, var(--primary-blue) 0%, var(--light-blue) 100%);
            color: #333;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .logo { height: 45px; }

        .title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark-navy);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }

        .dashboard-card {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            height: 750px;
        }

        .notes-sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid var(--primary-blue);
            font-size: 0.9rem;
        }

        /* App Section */
        .apk-download-btn {
            display: block; 
            padding: 14px; 
            background: var(--heifer-green); 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
        }

        .share-container {
            margin-top: 15px;
            padding: 12px;
            background: #f0f4f7;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }

        .share-label {
            font-size: 0.7rem;
            color: #555;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
        }

        .copy-group {
            display: flex;
            gap: 5px;
        }

        #displayLink {
            flex: 1;
            padding: 8px;
            font-size: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            color: var(--heifer-green);
            font-weight: bold;
        }

        .copy-btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            background: var(--dark-navy);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <img src="https://via.placeholder.com/150x50/ffffff/71a3c1?text=Logo" alt="Logo" class="logo">
        <div class="title">CLUSTER PERFORMANCE DASHBOARD</div>
        <img src="https://via.placeholder.com/150x50/ffffff/71a3c1?text=Heifer" alt="Heifer" class="logo">
    </header>

    <div class="main-layout">
        <section class="dashboard-card">
            <iframe title="cluster-performance" width="100%" height="100%" src="https://app.powerbi.com/reportEmbed?reportId=5eded2fa-4f25-4070-8027-167078ac1e50&autoAuth=true&ctid=da6a69e3-3bcd-4f44-a340-aead0cfda08f" frameborder="0" allowFullScreen="true"></iframe>
        </section>

        <aside class="notes-sidebar">
            <div class="note-box" style="border-left-color: var(--heifer-green);">
                <h4>📱 SAYE KATALE App</h4>
                
                <a href="https://drive.google.com/file/d/1nXO2U15OZZyE9uoOi6fo_shOrEmDglHp/view?usp=sharing" 
                   target="_blank"
                   id="downloadBtn" 
                   class="apk-download-btn">
                   📱 Download from Drive
                </a>
                
                <div style="text-align: center; font-size: 0.8rem; margin-bottom: 10px;">
                    Downloads: <span id="downloadCount" style="font-weight:bold;">0</span>
                </div>

                <div class="share-container">
                    <span class="share-label">Share Download Link:</span>
                    <div class="copy-group">
                        <div id="displayLink">SAYE-KATALE-App.link</div>
                        <button class="copy-btn" onclick="copyDriveLink()">Copy</button>
                    </div>
                </div>
            </div>

            <div class="note-box">
                <h4>🔐 Access</h4>
                <p><small>Sign in with Heifer Account. PSAs/Partners contact M&E for access.</small></p>
            </div>

            <div class="note-box">
                <h4>📅 Update Info</h4>
                <p><small>Check the report date filter for last refresh.</small></p>
            </div>
        </aside>
    </div>

    <script>
        // Use your provided Google Drive URL [cite: 1]
        const driveUrl = "https://drive.google.com/file/d/1nXO2U15OZZyE9uoOi6fo_shOrEmDglHp/view?usp=sharing";

        // Download Counter
        const btn = document.getElementById('downloadBtn');
        const display = document.getElementById('downloadCount');
        let count = localStorage.getItem('saye_drive_downloads') || 0;
        display.innerText = count;

        btn.addEventListener('click', () => {
            count++;
            localStorage.setItem('saye_drive_downloads', count);
            display.innerText = count;
        });

        // Copy Logic
        function copyDriveLink() {
            navigator.clipboard.writeText(driveUrl).then(() => {
                const copyBtn = document.querySelector('.copy-btn');
                copyBtn.innerText = 'Copied!';
                setTimeout(() => { copyBtn.innerText = 'Copy'; }, 2000);
            });
        }
    </script>
</body>
</html>
